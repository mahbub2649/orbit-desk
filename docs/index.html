<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Desk Demo</title>
<meta name="description" content="2-minute narrated demo of Orbit Desk, a radar satellite tasking console with a Claude analyst, deployed on AWS with Terraform.">
<meta property="og:title" content="Orbit Desk: 2-minute demo">
<meta property="og:description" content="Radar satellite tasking console: live events ranked by time to first radar look, a Claude analyst with read-only tools, and an AWS deployment.">
<meta property="og:image" content="demo-poster.jpg">
<style>
  :root {
    --bg: #000; --panel: #070707; --line: #24231f; --text: #e8e4d8; --dim: #a09c90; --hot: #ff5f1f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  h1 span { color: var(--hot); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .repo { color: var(--hot); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .repo:hover { text-decoration: underline; }
  .player { border: 1px solid var(--line); background: var(--panel); }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  .chapters button {
    all: unset; cursor: pointer; background: var(--panel); padding: 10px 12px; font-size: 13px; color: var(--text);
    display: flex; gap: 10px; align-items: baseline;
  }
  .chapters button:hover, .chapters button.on { background: #141311; }
  .chapters button.on { box-shadow: inset 3px 0 0 var(--hot); }
  .chapters time { color: var(--hot); font-size: 12px; min-width: 38px; }
  .chapters button:focus-visible { outline: 2px solid var(--hot); outline-offset: -2px; }
  footer { margin-top: 18px; color: var(--dim); font-size: 12.5px; }
  footer a { color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Orbit <span>Desk</span></h1>
      <p class="sub">Radar satellite tasking console · 2-minute narrated demo</p>
    </div>
    <a class="repo" href="https://github.com/mahbub2649/orbit-desk">github.com/mahbub2649/orbit-desk →</a>
  </header>

  <div class="player">
    <video id="v" controls preload="metadata" playsinline poster="demo-poster.jpg">
      <source src="demo.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="demo.mp4">Download the MP4</a>.
    </video>
    <nav class="chapters" id="ch" aria-label="Chapters"></nav>
  </div>

  <footer>
    Recorded from the running app; the waits for Claude are shortened. Voiceover generated with ElevenLabs.
    Independent portfolio project using only public data, not affiliated with ICEYE.
  </footer>
</main>
<script>
  const chapters = [
    [0, "Orbit Desk"], [14.8, "Live watch board"], [30.3, "Event dossier"], [43.4, "Time ×600"],
    [53.8, "Latency map"], [63.9, "Plain-language intake"], [75.5, "Claude analyst"],
    [87.4, "Prompt-injection test"], [101.6, "Tamper-evident audit"], [109.0, "Deployed on AWS"],
  ];
  const v = document.getElementById("v");
  const nav = document.getElementById("ch");
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const buttons = chapters.map(([t, label], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<time>${fmt(t)}</time><span>${String(i + 1).padStart(2, "0")} · ${label}</span>`;
    b.onclick = () => { v.currentTime = t; v.play(); };
    nav.appendChild(b);
    return b;
  });
  v.addEventListener("timeupdate", () => {
    let k = 0;
    chapters.forEach(([t], i) => { if (v.currentTime >= t - 0.05) k = i; });
    buttons.forEach((b, i) => b.classList.toggle("on", i === k));
  });
</script>
</body>
</html>
